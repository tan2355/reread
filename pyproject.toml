[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reread"
version = "0.3.0"
license = {file = "LICENSE"}
readme = "README.md"
description = "ReRead: action correction from frozen policy memory"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
train = ["numpy>=1.24", "Pillow>=10", "h5py>=3.10", "hydra-core>=1.3",
         "omegaconf>=2.3", "einops>=0.8", "safetensors>=0.5",
         "transformers==4.55.2", "diffusers>=0.30", "accelerate>=1.0",
         "ftfy", "sentencepiece", "imageio>=2.37", "rich>=14", "PyYAML>=6", "tqdm>=4.67"]
test = [
  "pytest>=8", "hydra-core>=1.3", "omegaconf>=2.3", "einops>=0.8",
  "imageio>=2.37", "rich>=14", "safetensors>=0.5",
  "transformers==4.55.2", "tqdm>=4.67",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reread = ["py.typed", "**/*.pyi"]
